name: Build & Release VYBE Web App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build & Test React Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Web Distribution
        run: |
          cd dist && zip -r ../vybe-web-dist.zip . && cd ..
          ls -lh vybe-web-dist.zip

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-web-dist
          path: vybe-web-dist.zip
          retention-days: 14
