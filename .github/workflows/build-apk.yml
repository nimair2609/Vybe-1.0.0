name: Build & Release VYBE Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Twice-weekly cache touch so the persistent signing keystore never expires after 7 days idle
    - cron: '0 3 * * 1,4'

permissions:
  contents: write

jobs:
  keep-keystore-alive:
    name: Refresh Persistent Keystore Cache
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Signing Keystore Cache TTL
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: vybe-android-debug-keystore-v1
          restore-keys: |
            vybe-android-debug-keystore-

  build:
    name: Build & Publish Signed APK
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Environment and Google Services
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "109876543210", "project_id": "vybe-social-app", "storage_bucket": "vybe-social-app.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:109876543210:android:a1b2c3d4e5f6071829", "android_client_info": { "package_name": "com.aistudio.vybe.nzqpvx" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaSyVybeProductionReadyAndroidClientKey2026" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Cache Persistent Signing Keystore
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: vybe-android-debug-keystore-v1
          restore-keys: |
            vybe-android-debug-keystore-

      - name: Restore or Generate Persistent Signing Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-keystore
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "Restoring signing keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret..."
            echo "$SECRET_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > debug.keystore
            cp debug.keystore .ci-keystore/debug.keystore
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring official debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore .ci-keystore/debug.keystore
          elif [ -f .ci-keystore/debug.keystore ]; then
            echo "Restoring persistent debug.keystore from GitHub Actions cache..."
            cp .ci-keystore/debug.keystore debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating initial persistent debug.keystore for repository..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore .ci-keystore/debug.keystore
          else
            cp debug.keystore .ci-keystore/debug.keystore
          fi
          echo "Verifying debug.keystore fingerprint:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Stamp Monotonic Release Version
        id: version
        run: |
          BASE_VER=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          MAJOR_MINOR=$(echo "$BASE_VER" | awk -F. '{print $1"."$2}')
          if [ -z "$MAJOR_MINOR" ] || [ "$MAJOR_MINOR" = "." ]; then
            MAJOR_MINOR="1.2"
          fi
          RUN_NUM=${{ github.run_number }}
          CI_VERSION_CODE=$((100 + RUN_NUM))
          if [ "$CI_VERSION_CODE" -lt 163 ]; then
            CI_VERSION_CODE=$((163 + RUN_NUM))
          fi
          CI_VERSION_NAME="${MAJOR_MINOR}.${RUN_NUM}"
          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${CI_VERSION_CODE}/" app/build.gradle.kts
          sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"${CI_VERSION_NAME}\"/" app/build.gradle.kts
          echo "Stamped versionName=${CI_VERSION_NAME} (versionCode=${CI_VERSION_CODE})"
          echo "version_name=${CI_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CI_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=VYBE-v${CI_VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify & Name APK Output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk_filename }}"
            echo "SUCCESS: Built ${{ steps.version.outputs.apk_filename }}!"
            ls -lh "${{ steps.version.outputs.apk_filename }}"
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-apk-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.version.outputs.apk_filename }}
          retention-days: 14

      - name: Publish GitHub Release for In-App Auto-Updater
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: VYBE v${{ steps.version.outputs.version_name }} (Build #${{ github.run_number }})
          body: |
            Automated VYBE Android release built from commit `${{ github.sha }}`.
            - **Version:** `v${{ steps.version.outputs.version_name }}` (`versionCode: ${{ steps.version.outputs.version_code }}`)
            - **Package:** `com.aistudio.vybe.nzqpvx`
            - **In-App Update Ready:** Signed with persistent repository keystore.
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk_filename }}
