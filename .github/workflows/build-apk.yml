name: Build VYBE Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Environment and Google Services
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "109876543210", "project_id": "vybe-social-app", "storage_bucket": "vybe-social-app.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:109876543210:android:a1b2c3d4e5f6071829", "android_client_info": { "package_name": "com.aistudio.vybe.nzqpvx" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaSyVybeProductionReadyAndroidClientKey2026" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for local signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "SUCCESS: Debug APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
