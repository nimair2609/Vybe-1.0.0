# ==============================================================================
# VYBE WEB & PWA — NETLIFY PRODUCTION CONFIGURATION (ROOT MONOREPO)
# Preserves the root Android Gradle project & .github/workflows/build-apk.yml intact.
# ==============================================================================

[build]
  base = "web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Never cache HTML shell, Service Worker, Manifest, or Version check so updates propagate safely
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=UTF-8"

# Cache content-hashed Vite bundles immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Production HTTPS & Browser Permission Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), fullscreen=(self)"

# Single-Page Application (SPA) client-side route fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
