# VYBE Social Platform - Netlify Production Configuration
# Builds both the Main Web App and the Standalone Admin Command Center

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Security & Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for Vite static hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify Serverless API & Privileged Admin Routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Admin Command Center Routes (/admin, /admin/*)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# APK Direct Download route
[[redirects]]
  from = "/download"
  to = "/vybe-debug.apk"
  status = 200

# Single Page Application (SPA) Fallback for VYBE Social Web App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
