<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Radial Gradient: Dark Emerald Navy/Obsidian -->
    <radialGradient id="official_navy_bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0E1E19" />
      <stop offset="70%" stop-color="#07130F" />
      <stop offset="100%" stop-color="#030806" />
    </radialGradient>

    <!-- Emerald Green / Neon Green Metallic Rim -->
    <linearGradient id="official_rim_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE" />
      <stop offset="30%" stop-color="#00E676" />
      <stop offset="70%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Neon Emerald Glow Filter -->
    <filter id="emerald_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#00E676" flood-opacity="0.55" />
    </filter>

    <!-- Left Arm Gradient: Cyan -> Electric Blue -> Violet -->
    <linearGradient id="vybe_left_arm_off" x1="15%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#0080FF" />
      <stop offset="75%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Right Arm Gradient: Indigo Fold -> Violet -> Vibrant Magenta -->
    <linearGradient id="vybe_right_arm_off" x1="10%" y1="80%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="30%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Fold Occlusion Shadow -->
    <linearGradient id="fold_shadow_off" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Circular Attachment Gradient -->
    <linearGradient id="star_bubble_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B050" />
    </linearGradient>

    <!-- Glass Top Arc Highlight -->
    <linearGradient id="glass_sheen_off" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Circular Emblem with Glow & Metallic Border -->
  <circle cx="50" cy="50" r="41" fill="url(#official_navy_bg)" stroke="url(#official_rim_grad)" stroke-width="3" filter="url(#emerald_glow)" />

  <!-- Inner Soft Bevel Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#69F0AE" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Top Glass Arc Highlight for 3D Depth -->
  <path d="M 18 42 A 38 38 0 0 1 82 42 A 38 34 0 0 0 18 42 Z" fill="url(#glass_sheen_off)" />

  <!-- CENTRAL ORIGINAL VYBE LOGO: Authentic Gradient Ribbon V -->
  <g transform="translate(50, 48) scale(0.68) translate(-50, -50)">
    <!-- Right Arm (Folded Layer beneath Left Arm Top, sweeping to top right) -->
    <path d="M 50.5 54.5 C 55 46 62.5 35 71 30.5 C 75.5 28 81 29.5 83 34 C 84.5 37.5 83 42 78.5 47 C 69.5 57 58 68 50.5 73.5 Z"
          fill="url(#vybe_right_arm_off)" />

    <!-- Left Arm & Base Loop -->
    <path d="M 23 31.5 C 27 28 32.5 29 36 33.5 L 49.5 54 C 54.5 62 49 73 40 73 C 35.5 73 31 69.5 28 65 L 18 41 C 16 36.5 19 32.5 23 31.5 Z"
          fill="url(#vybe_left_arm_off)" />

    <!-- Precision Ribbon Contour -->
    <path d="M 21.5 33.5 C 25.5 28.5 32 29 36.5 34.5 L 48.5 53 C 50.5 56 53 58 56.5 58 C 61 58 66 52 71.5 44 L 79 33 C 82 28.5 87 29.5 89 34 C 90.5 37.5 89.5 42 85.5 48 C 76.5 61 67.5 74.5 52 74.5 C 41 74.5 34 67 29.5 59.5 L 18 39 C 16.5 36 18 34 21.5 33.5 Z"
          fill="url(#vybe_left_arm_off)" />

    <!-- Right Flange Ribbon Sweep -->
    <path d="M 50 56.5 C 53.5 51 58 44.5 64.5 38.5 C 70.5 33 76.5 30 81.5 30 C 85.5 30 88.5 32.5 88.5 36.5 C 88.5 40 85.5 45 79.5 53 C 71.5 63.5 62.5 73 51 73.5 C 49 67.5 48.5 61.5 50 56.5 Z"
          fill="url(#vybe_right_arm_off)" />

    <!-- Fold Occlusion Shadow -->
    <path d="M 48.5 54 C 51 57.5 54 60 58 60 C 56 63 53 66 50 67 Z"
          fill="url(#fold_shadow_off)" />
  </g>

  <!-- Bottom-Right Circular Attachment: Emerald Green with White 5-Pointed Star -->
  <g>
    <!-- Attachment Background & Dark Cutout Border -->
    <circle cx="76" cy="76" r="15" fill="#040907" />
    <circle cx="76" cy="76" r="13" fill="url(#star_bubble_grad)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="76" cy="76" r="13" fill="none" stroke="#69F0AE" stroke-width="0.8" />

    <!-- Crisp White 5-Pointed Official Star -->
    <polygon points="76,69.5 77.8,74.2 82.8,74.5 78.8,77.8 80.3,82.5 76,79.8 71.7,82.5 73.2,77.8 69.2,74.5 74.2,74.2"
             fill="#FFFFFF" />
  </g>
</svg>
