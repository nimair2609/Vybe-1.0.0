<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Radial Gradient: Dark Navy/Obsidian -->
    <radialGradient id="v_navy_bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10182E" />
      <stop offset="70%" stop-color="#090E1C" />
      <stop offset="100%" stop-color="#050812" />
    </radialGradient>

    <!-- Electric Blue / Cyan Metallic Rim -->
    <linearGradient id="verified_rim_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Outer Neon Cyan Glow Filter -->
    <filter id="cyan_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#00F0FF" flood-opacity="0.55" />
    </filter>

    <!-- Left Arm Gradient: Cyan -> Electric Blue -> Violet -->
    <linearGradient id="vybe_left_arm" x1="15%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#0080FF" />
      <stop offset="75%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Right Arm Gradient: Indigo Fold -> Violet -> Vibrant Magenta -->
    <linearGradient id="vybe_right_arm" x1="10%" y1="80%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="30%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Fold Crease Shadow -->
    <linearGradient id="fold_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Circular Attachment Gradient -->
    <linearGradient id="tick_bubble_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glass Top Arc Highlight -->
    <linearGradient id="glass_sheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Circular Emblem with Glow & Metallic Border -->
  <circle cx="50" cy="50" r="41" fill="url(#v_navy_bg)" stroke="url(#verified_rim_grad)" stroke-width="3" filter="url(#cyan_glow)" />

  <!-- Inner Soft Bevel Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Top Glass Arc Highlight for 3D Depth -->
  <path d="M 18 42 A 38 38 0 0 1 82 42 A 38 34 0 0 0 18 42 Z" fill="url(#glass_sheen)" />

  <!-- CENTRAL ORIGINAL VYBE LOGO: Authentic Gradient Ribbon V -->
  <g transform="translate(50, 48) scale(0.68) translate(-50, -50)">
    <!-- Right Arm (Folded Layer beneath Left Arm Top, sweeping to top right) -->
    <path d="M 50.5 54.5 C 55 46 62.5 35 71 30.5 C 75.5 28 81 29.5 83 34 C 84.5 37.5 83 42 78.5 47 C 69.5 57 58 68 50.5 73.5 Z"
          fill="url(#vybe_right_arm)" />

    <!-- Left Arm & Base Loop (Sweeps from Top-Left through Bottom Loop to Center Fold) -->
    <path d="M 23 31.5 C 27 28 32.5 29 36 33.5 L 49.5 54 C 54.5 62 49 73 40 73 C 35.5 73 31 69.5 28 65 L 18 41 C 16 36.5 19 32.5 23 31.5 Z"
          fill="url(#vybe_left_arm)" />

    <!-- Precision Ribbon Contour (Seamless Full V matching vybe_ribbon_v.png) -->
    <path d="M 21.5 33.5 C 25.5 28.5 32 29 36.5 34.5 L 48.5 53 C 50.5 56 53 58 56.5 58 C 61 58 66 52 71.5 44 L 79 33 C 82 28.5 87 29.5 89 34 C 90.5 37.5 89.5 42 85.5 48 C 76.5 61 67.5 74.5 52 74.5 C 41 74.5 34 67 29.5 59.5 L 18 39 C 16.5 36 18 34 21.5 33.5 Z"
          fill="url(#vybe_left_arm)" />

    <!-- Right Flange Ribbon Sweep -->
    <path d="M 50 56.5 C 53.5 51 58 44.5 64.5 38.5 C 70.5 33 76.5 30 81.5 30 C 85.5 30 88.5 32.5 88.5 36.5 C 88.5 40 85.5 45 79.5 53 C 71.5 63.5 62.5 73 51 73.5 C 49 67.5 48.5 61.5 50 56.5 Z"
          fill="url(#vybe_right_arm)" />

    <!-- Fold Occlusion Shadow -->
    <path d="M 48.5 54 C 51 57.5 54 60 58 60 C 56 63 53 66 50 67 Z"
          fill="url(#fold_shadow)" />
  </g>

  <!-- Bottom-Right Circular Attachment: Electric Blue with White Verification Tick -->
  <g>
    <!-- Attachment Background & Dark Cutout Border -->
    <circle cx="76" cy="76" r="15" fill="#060913" />
    <circle cx="76" cy="76" r="13" fill="url(#tick_bubble_grad)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="76" cy="76" r="13" fill="none" stroke="#00F0FF" stroke-width="0.8" />

    <!-- Crisp White Verification Tick -->
    <path d="M 70.5 76 L 74.5 80 L 82 71.5"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
