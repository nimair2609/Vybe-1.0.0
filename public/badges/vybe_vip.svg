<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 114" width="100" height="114">
  <defs>
    <!-- Background Radial Gradient: Dark Luxury Obsidian/Navy -->
    <radialGradient id="vip_navy_bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#141524" />
      <stop offset="70%" stop-color="#0A0B14" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <!-- 24K Metallic Gold Rim Gradient -->
    <linearGradient id="vip_gold_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Luxury Gold Crown Gradient -->
    <linearGradient id="crown_gold_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Outer Gold Glow Filter -->
    <filter id="gold_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>

    <!-- Left Arm Gradient: Cyan -> Electric Blue -> Violet -->
    <linearGradient id="vybe_left_arm_vip" x1="15%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#0080FF" />
      <stop offset="75%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Right Arm Gradient: Indigo Fold -> Violet -> Vibrant Magenta -->
    <linearGradient id="vybe_right_arm_vip" x1="10%" y1="80%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="30%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Fold Occlusion Shadow -->
    <linearGradient id="fold_shadow_vip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Top Arc Highlight -->
    <linearGradient id="glass_sheen_vip" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Circular Luxury Emblem -->
  <circle cx="50" cy="65" r="41" fill="url(#vip_navy_bg)" stroke="url(#vip_gold_rim)" stroke-width="3.2" filter="url(#gold_glow)" />

  <!-- Inner Metallic Bevel Ring -->
  <circle cx="50" cy="65" r="38" fill="none" stroke="#FDE047" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Top Glass Arc Highlight -->
  <path d="M 18 57 A 38 38 0 0 1 82 57 A 38 34 0 0 0 18 57 Z" fill="url(#glass_sheen_vip)" />

  <!-- CENTRAL ORIGINAL VYBE LOGO: Authentic Gradient Ribbon V -->
  <g transform="translate(50, 63) scale(0.68) translate(-50, -50)">
    <!-- Right Arm (Folded Layer beneath Left Arm Top, sweeping to top right) -->
    <path d="M 50.5 54.5 C 55 46 62.5 35 71 30.5 C 75.5 28 81 29.5 83 34 C 84.5 37.5 83 42 78.5 47 C 69.5 57 58 68 50.5 73.5 Z"
          fill="url(#vybe_right_arm_vip)" />

    <!-- Left Arm & Base Loop -->
    <path d="M 23 31.5 C 27 28 32.5 29 36 33.5 L 49.5 54 C 54.5 62 49 73 40 73 C 35.5 73 31 69.5 28 65 L 18 41 C 16 36.5 19 32.5 23 31.5 Z"
          fill="url(#vybe_left_arm_vip)" />

    <!-- Precision Ribbon Contour -->
    <path d="M 21.5 33.5 C 25.5 28.5 32 29 36.5 34.5 L 48.5 53 C 50.5 56 53 58 56.5 58 C 61 58 66 52 71.5 44 L 79 33 C 82 28.5 87 29.5 89 34 C 90.5 37.5 89.5 42 85.5 48 C 76.5 61 67.5 74.5 52 74.5 C 41 74.5 34 67 29.5 59.5 L 18 39 C 16.5 36 18 34 21.5 33.5 Z"
          fill="url(#vybe_left_arm_vip)" />

    <!-- Right Flange Ribbon Sweep -->
    <path d="M 50 56.5 C 53.5 51 58 44.5 64.5 38.5 C 70.5 33 76.5 30 81.5 30 C 85.5 30 88.5 32.5 88.5 36.5 C 88.5 40 85.5 45 79.5 53 C 71.5 63.5 62.5 73 51 73.5 C 49 67.5 48.5 61.5 50 56.5 Z"
          fill="url(#vybe_right_arm_vip)" />

    <!-- Fold Occlusion Shadow -->
    <path d="M 48.5 54 C 51 57.5 54 60 58 60 C 56 63 53 66 50 67 Z"
          fill="url(#fold_shadow_vip)" />
  </g>

  <!-- PREMIUM 3D METALLIC GOLD CROWN CROWNING THE EMBLEM -->
  <g filter="url(#gold_glow)">
    <!-- Crown Base Arch -->
    <path d="M 33 24.5 Q 50 22 67 24.5 L 68 28.5 Q 50 26 32 28.5 Z"
          fill="url(#crown_gold_grad)" stroke="#FFF3B0" stroke-width="0.6" />

    <!-- Crown Body with 5 Majestic Points -->
    <path d="M 33 24.5 L 29 12 L 40 19 L 50 6.5 L 60 19 L 71 12 L 67 24.5 Q 50 22 33 24.5 Z"
          fill="url(#crown_gold_grad)"
          stroke="#FFFBEB"
          stroke-width="1.2"
          stroke-linejoin="round" />

    <!-- Crown Bevel Highlights -->
    <path d="M 50 6.5 L 50 23" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 40 19 L 45 23" stroke="#FFFBEB" stroke-width="0.8" opacity="0.6" />
    <path d="M 60 19 L 55 23" stroke="#FFFBEB" stroke-width="0.8" opacity="0.6" />

    <!-- Crown Jewels / Orbs at the 3 Peaks -->
    <!-- Center Jewel (Tallest) -->
    <circle cx="50" cy="5.5" r="2.8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8" />
    <circle cx="49.2" cy="4.7" r="0.8" fill="#FFFFFF" />

    <!-- Left Jewel -->
    <circle cx="28.5" cy="11.5" r="2.2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.7" />
    <circle cx="27.8" cy="10.8" r="0.6" fill="#FFFFFF" />

    <!-- Right Jewel -->
    <circle cx="71.5" cy="11.5" r="2.2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.7" />
    <circle cx="70.8" cy="10.8" r="0.6" fill="#FFFFFF" />
  </g>
</svg>
